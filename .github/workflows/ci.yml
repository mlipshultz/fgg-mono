name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo --affected needs main's history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build --affected
        env:
          TURBO_SCM_BASE: origin/main

  e2e:
    name: Browser tests (fixtures)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@fgg/web... # no NEXT_PUBLIC_API_URL → fixture mode
      - run: pnpm --filter @fgg/web exec playwright install --with-deps chromium
      - run: pnpm --filter @fgg/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  cdk-diff:
    name: CDK synth + diff (dev)
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@fgg/infra... # Lambda bundles import @fgg/types from dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: cdk diff
        id: diff
        working-directory: infra
        run: |
          set -o pipefail
          pnpm cdk diff -c stage=dev 2>&1 | tee diff.txt
      - name: Comment diff on PR
        if: always() && steps.diff.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### `cdk diff` (dev)'
            echo '<details><summary>Show diff</summary>'
            echo
            echo '```'
            tail -c 60000 infra/diff.txt
            echo '```'
            echo '</details>'
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md --edit-last || \
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md

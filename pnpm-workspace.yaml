packages:
  - apps/*
  - packages/*
  - services/*
  - infra

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1144.0'
  - '@aws-sdk/s3-request-presigner@3.1144.0'
  - '@aws-sdk/client-cognito-identity-provider@3.1145.0'
  - '@aws-sdk/client-secrets-manager@3.1145.0'
